name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # The browser scripts and the Python, in the format and lint rules of the
  # projects Prumo checks.
  style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Format and lint the scripts
        run: npx --yes @biomejs/biome@2.5.15 ci

      - name: Format and lint the Python
        run: pipx run ruff==0.16.10 check && pipx run ruff==0.16.10 format --check

  # Prumo's own checks against a fixture site, every guard both ways, in the
  # browser each runner image ships: Chrome on Linux, Edge on Windows, where
  # the browser hands off to another process and holds its profile locked.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python: [ '3.10', '3.12' ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Pillow, for diff
        run: pip install pillow

      - name: Run the checks
        run: python -m unittest discover -s tests -v
