name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Prumo's own checks against a fixture site, every guard both ways, in the
  # browser each runner image ships: Chrome on Linux, Edge on Windows, where
  # the browser hands off to another process and holds its profile locked.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python: [ '3.10', '3.12' ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Pillow, for diff
        run: pip install pillow

      - name: Run the checks
        run: python -m unittest discover -s tests -v
