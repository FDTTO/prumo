name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Prumo's own checks, in the Chrome the runner image ships: the command
  # line against a fixture site, every guard both ways.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow, for diff
        run: pip install pillow

      - name: Run the checks
        run: python -m unittest discover -s tests -v
